# LAPO with DINOv3 - HuggingFace Dataset Configuration
# Architecture matches lapo_hf.yaml, using DINOv3 patch features

project: "laom"
group: "lapo_dinov3_hf"
name: "lapo_dinov3_cheetah_vanilla"
seed: 0

lapo:
  # --- DINOv3 Settings ---
  use_dinov3: true
  dinov3_model_name: "facebook/dinov3-vits16-pretrain-lvd1689m"
  upscale_size: 224
  freeze_dinov3: true
  use_patch_pooling: true  # Spatial average over patch tokens
  
  # --- Training parameters (matching lapo_hf.yaml) ---
  num_epochs: 10          
  batch_size: 512
  future_obs_offset: 10   
  learning_rate: 0.0001   
  weight_decay: 0.0
  warmup_epochs: 3
  grad_norm: null
  
  # --- Model architecture ---
  feature_dim: 1152  # DINOv3-ViT-S (384) * 3 frames = 1152
  latent_action_dim: 128 
  act_head_dim: 1024
  act_head_dropout: 0.0
  obs_head_dim: 1024
  obs_head_dropout: 0.0
  frame_stack: 3
  
  # --- HuggingFace Dataset Configuration ---
  use_hf_dataset: true
  hf_dataset_name: "EpicPinkPenguin/visual_distracting_control_suite"
  hf_config_name: "cheetah_run"
  hf_split: "train"
  hf_streaming: true
  hf_buffer_size: 10000
  use_masked_obs: false  # Enable masked observation mode (multiply obs with binary mask)
  clip_actions: false    # Clip actions to [-1, 1] range
  
  # HDF5 fallback
  data_path: "data/test.hdf5"
